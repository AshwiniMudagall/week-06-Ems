<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Already Paid — FieldOps Manager</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    body { background: #f0f4f8; font-family: 'Segoe UI', sans-serif; }
    .result-card {
      max-width: 440px; margin: 70px auto;
      background: #fff; border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      text-align: center; padding: 48px 32px;
    }
    .info-icon {
      width: 80px; height: 80px; background: #dbeafe;
      border-radius: 50%; display: flex; align-items: center;
      justify-content: center; margin: 0 auto 20px;
      font-size: 2.5rem; color: #2563eb;
    }
  </style>
</head>
<body>
  <div class="result-card">
    <div class="info-icon"><i class="fas fa-info"></i></div>
    <h3 class="fw-bold text-primary mb-2">Already Paid</h3>
    <p class="text-muted">
      This invoice for <strong>{{ job.title }}</strong> has already been settled.
      No further payment is required.
    </p>
    <div class="alert alert-success mt-3">
      <i class="fas fa-check-circle me-2"></i>Amount: ₹{{ "%.2f"|format(job.amount) }} — <strong>Paid</strong>
    </div>
  </div>
</body>
</html>
