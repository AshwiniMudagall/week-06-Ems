<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment Failed — FieldOps Manager</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    body { background: #f0f4f8; font-family: 'Segoe UI', sans-serif; }
    .result-card {
      max-width: 440px; margin: 70px auto;
      background: #fff; border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      text-align: center; padding: 48px 32px;
    }
    .fail-icon {
      width: 80px; height: 80px; background: #fee2e2;
      border-radius: 50%; display: flex; align-items: center;
      justify-content: center; margin: 0 auto 20px;
      font-size: 2.5rem; color: #dc2626;
    }
    .btn-retry {
      background: #2563eb; color: #fff; border: none;
      border-radius: 8px; padding: 10px 24px; font-weight: 600;
      text-decoration: none;
    }
    .btn-retry:hover { background: #1e40af; color: #fff; }
  </style>
</head>
<body>
  <div class="result-card">
    <div class="fail-icon">
      <i class="fas fa-times"></i>
    </div>
    <h3 class="fw-bold text-danger mb-2">Payment Failed</h3>
    <p class="text-muted mb-4">
      Your payment could not be processed. No amount has been charged.
      Please try again or contact support.
    </p>
    {% if job %}
    <a href="{{ url_for('client_pay', jid=job.id) }}" class="btn-retry">
      <i class="fas fa-redo me-2"></i>Try Again
    </a>
    {% endif %}
    <p class="text-muted small mt-4">
      If the issue persists, please contact us with your job reference number.
    </p>
  </div>
</body>
</html>
